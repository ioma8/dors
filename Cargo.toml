[package]
name = "dors"
version = "0.1.0"
description = "A macOS dock replacement built with native AppKit"
authors = ["jakubkolcar"]
edition = "2024"

[lib]
name = "dors"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dors"
path = "src/main.rs"

[[bin]]
name = "dock_inject_experiment"
path = "src/bin/dock_inject_experiment.rs"

[dependencies]
base64 = "0.22"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics2 = "0.4"
ctrlc = "3.4"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3"
