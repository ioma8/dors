[package]
name = "dors-tauri"
version = "0.1.0"
description = "A macOS dock replacement built with Tauri"
authors = ["jakubkolcar"]
edition = "2024"

[lib]
name = "dors_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
